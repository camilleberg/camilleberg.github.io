# ================================================================
# _config.yml — Camille Bergeron · camilleberg.github.io
# ================================================================

# ----------------------------------------------------------------
# SITE IDENTITY
# ----------------------------------------------------------------
title: Camille Bergeron
bio: Current Ph.D Student in Economics

# Twitter/SEO summary
description: A blog about technology and stuff related

# ----------------------------------------------------------------
# PROFILE IMAGE
# Set external-image: false because the image lives in the repo.
# The path is relative to the repo root.
# ----------------------------------------------------------------
external-image: false
picture: assets/images/profile.jpg

# ----------------------------------------------------------------
# THEME
# dark-theme: false   → use the light Indigo base theme
# We then layer our own palette on top via custom.css (see below).
# Setting this to "auto" would switch based on the visitor's OS
# preference, but our custom.css is written for light mode only,
# so we fix it to false for now.
# ----------------------------------------------------------------
dark-theme: false

# ----------------------------------------------------------------
# CUSTOM CSS  ← NEW
# Indigo supports injecting an extra stylesheet via this key.
# The value is the URL path from the site root.
# This loads assets/css/custom.css on every page, which is where
# all of the palette overrides live.
# ----------------------------------------------------------------
custom-css: assets/css/custom.css

# ----------------------------------------------------------------
# URL & PERMALINKS
# ----------------------------------------------------------------
url: https://camilleberg.github.io
permalink: /:title/

# ----------------------------------------------------------------
# ANALYTICS (disabled — token not set)
# Uncomment and fill in your GA token when ready.
# ----------------------------------------------------------------
# analytics-google: 'UA-MYANALYTICS'

# ----------------------------------------------------------------
# COMMENTS (Disqus)
# Only posts whose category is in the list below will show
# the comment box.
# ----------------------------------------------------------------
disqus:
  shortname: github
  categories: [blog, project]

# ----------------------------------------------------------------
# SOCIAL LINKS
# Comment out any you don't want to appear in the profile block.
# ----------------------------------------------------------------
linkedin: camille-bergeron
github: camilleberg
email: cghb@uw.edu

# ----------------------------------------------------------------
# AUTHORS
# Used by the "show-author" block at the end of posts.
# The picture path must match the one in the PROFILE IMAGE block.
# ----------------------------------------------------------------
authors:
  camillebergeron:
    name: Camille Bergeron
    bio: I try
    external-image: false
    picture: assets/images/profile.jpg

# ----------------------------------------------------------------
# LAYOUT WIDTH
# normal = 560px content column (better for reading long prose)
# large  = 810px (better for wide tables or code-heavy posts)
# ----------------------------------------------------------------
width: normal

# ----------------------------------------------------------------
# FEATURE FLAGS
# Comment out a line to hide that section from the nav.
# ----------------------------------------------------------------
projects: true
about: true
resume: true
# because apparently its url
# blog: true   ← uncomment when you have posts to show

# ----------------------------------------------------------------
# POST OPTIONS
# ----------------------------------------------------------------
read-time: true       # shows "N min read" on each post
show-tags: true       # shows tag pills on each post
related: true         # shows related posts at the bottom
post-advance-links: [blog]   # prev/next arrows only on blog posts
show-author: true     # author block at the end of each post

# ----------------------------------------------------------------
# ANIMATIONS
# Indigo has subtle fade-in animations on page load.
# Set to false if you want a completely static feel.
# ----------------------------------------------------------------
animation: true

# ----------------------------------------------------------------
# DEFAULTS
# All files without an explicit layout will be treated as "post".
# hidden: false means posts appear in lists unless overridden.
# ----------------------------------------------------------------
defaults:
  - scope:
      path: ""
      layout: "post"
    values:
      hidden: false

# ----------------------------------------------------------------
# PLUGINS
# ----------------------------------------------------------------
plugins:
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-feed
  - jemoji

# ----------------------------------------------------------------
# HTML COMPRESSION
# Minifies HTML in production; skips in development/stage so
# errors are easier to debug.
# ----------------------------------------------------------------
compress_html:
  ignore:
    envs:
      - development
      - stage

# ----------------------------------------------------------------
# EXCLUDED FILES
# These are never copied into the _site build output.
# ----------------------------------------------------------------
exclude:
  [
    "README.md",
    "Gemfile",
    "Gemfile.lock",
    "FAQ.md",
    "vendor",
  ]